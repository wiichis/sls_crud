service: crud-serverless-users

provider:
  name: aws
  runtime: nodejs18.x
  apiGateway:
    apiKeys:
      - crud-serverless-users-apikey
  iam:
    role:
      statements:
          - Effect: Allow
            Action:
              - dynamodb:DescribeTable
            Resource: arn:aws:dynamodb:us-east-1:065038859985:table/usersTable
          - Effect: Allow
            Action: 's3:*'
            Resource: arn:aws:s3:::bucket-serverless-course-will07/*
          - Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:GetParameter
              - ssm:DeleteParameter
            Resource: arn:aws:ssm:us-east-1:065038859985:parameter/serverless-framework/*
  environment:
    BUCKET: bucket-serverless-course-will07
    #SECRET_EGG: ${ssm:/SECRET_EGG}


#plugins:
  #- serverless-apigateway-service-proxy
  #- serverless-lift
  #- serverless-domain-manager

package:
  individually: true
  patterns:
    - "!*/**"


