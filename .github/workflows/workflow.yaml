name: Deploy DEV

on:
  pull_request:
    branches: [ main ]

jobs:
  testing-changes:
    runs-on: ubuntu-latest
    name: Build/Test
    steps:
      - uses: actions/checkout@v3

      - name: NPM - Load cached venv
        id: cached-npm-dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: NPM - Install dependencies
        if: steps.cached-npm-dependencies.outputs.cache-hit != 'true'
        run: 'npm install'

      - name: Run Tests
        run: |
          npm run test

  build-js-layer-deps:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    name: Build SLS Layer - Prod
    container:
      image: "node:14-buster"
    steps:
      - uses: actions/checkout@v3

      - run: |
          npm install --production
          mkdir nodejs
          mv node_modules nodejs
          apt update -y && apt install zip -y
          zip -r nodejs.zip nodejs/

      - uses: actions/upload-artifact@v4
        with:
          name: nodejsdeps
          path: nodejs.zip

  deploy-env:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: [testing-changes, build-js-layer-deps]
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v3
        with:
          name: nodejsdeps
          path: app/

      - name: Deploy using sls
        run: 'npx sls deploy'
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v1
        with:
          message: |
            Your SLS App was deployed!
            Awesome :D
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}